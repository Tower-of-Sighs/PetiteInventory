plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

def properties = new Properties()
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base { archivesName = "${mod_name}-neoforge-1.21.1" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// NeoForge 1.21.1 owns only the loader lifecycle and the SPI translation;
// inventory policy and event dispatch remain in common.

neoForge {
    version = neoforge_121_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.output.dir(
        project(':common').layout.buildDirectory.dir('classes/java/main'),
        builtBy: ':common:classes'
)

def copyCommonClasses = tasks.register('copyCommonClasses', Copy) {
    dependsOn ':common:classes'
    from project(':common').sourceSets.main.output.classesDirs
    into layout.buildDirectory.dir('classes/java/main')
}

dependencies {
    compileOnly project(':common')

    implementation "curse.maven:sophisticated-core-618298:8705083"
    implementation "curse.maven:sophisticated-backpacks-422301:8687841"
    implementation "curse.maven:item-borders-513769:5591010"
    implementation "curse.maven:iceberg-520110:6423863"
    implementation "curse.maven:prism-lib-638111:6372979"
    implementation "curse.maven:kubejs-238086:8715199"
    implementation "curse.maven:rhino-416294:8463898"
    implementation "curse.maven:architectury-api-419699:8492726"
    implementation "curse.maven:jei-238222:8769490"
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = "https://www.cursemaven.com"
            }
        }
        filter {
            includeGroup("curse.maven")
        }
    }
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn copyCommonClasses
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: neoforge_121_minecraft_version,
            neoforge_version: neoforge_121_version,
            neoforge_version_range: neoforge_121_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from project(':common').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}



publishMods {
    file = tasks.jar.archiveFile
    version = mod_version
    changelog = file('../../CHANGELOG_EN.md').text
    type = STABLE
    displayName = "${mod_name} ${mod_version} for NeoForge 1.21.1"
    modLoaders.add("neoforge")

    curseforge {
        projectId = "1386712"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add("1.21.1")
        client = true
        server = true
    }

    modrinth {
        projectId = "Prhnq8xz"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add("1.21.1")
        environment = CLIENT_AND_SERVER
    }
}