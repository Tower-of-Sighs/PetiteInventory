plugins {
    id 'base'
}

tasks.register('buildForge1201', Exec) {
    group = 'build'
    description = 'Builds the Forge 1.20.1 target as an independent project.'
    workingDir rootDir
    commandLine 'cmd', '/c', 'gradlew.bat', '-p', 'targets\\forge-1.20.1', 'build', '--console', 'plain', '--no-daemon'
}

tasks.register('buildNeoForge1211', Exec) {
    group = 'build'
    description = 'Builds the NeoForge 1.21.1 target as an independent project.'
    workingDir rootDir
    commandLine 'cmd', '/c', 'gradlew.bat', '-p', 'targets\\neoforge-1.21.1', 'build', '--console', 'plain', '--no-daemon'
}

tasks.named('build') {
    dependsOn ':common:build'
}
